<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .message-container {
            background-color: white;
            border: 1px solid #ddd;
            padding: 40px 50px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        .message-container h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .message-container p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 30px;
        }

        .message-container button {
            background-color: #007bff;
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .message-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="message-container">
        <h1 th:text="${errorMessage != null && errorMessage.contains('successfully')} ? 'Success 🎉' : 'Oops! Something went wrong 😞'">
            Message
        </h1>
        <p th:text="${errorMessage}">An unexpected error occurred. Please try again later.</p>
        <button onclick="goBack()">Go Back</button>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
