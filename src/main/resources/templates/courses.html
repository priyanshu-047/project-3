<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Acadmia3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff;
            color: #1a1a1a;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        .logo h1 {
            font-weight: 800;
            font-size: 24px;
            color: #3b3b3b;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav a {
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 600;
        }
        nav a.active,
        nav a:hover {
            color: #6c5ce7;
        }
        .courses-container {
            padding: 40px 10%;
        }
        h2 {
            margin-top: 20px;
            color: #6c5ce7;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 200px;
        }
        button {
            background-color: #6c5ce7;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #5945c0;
        }
        ul#course {
            list-style: none;
            padding: 20px 0;
        }
        footer {
            background-color: #ffffff;
            color: #999;
            text-align: center;
            padding: 30px 10%;
            font-size: 14px;
            border-top: 1px solid #eee;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Acadmia3</h1>
        </div>
        <nav>
           <ul>
                <li><a href="http://localhost:5001/">Home</a></li>
                <li><a href="http://localhost:5001/user/dashboard">Dashboard</a></li>
                <li><a href="http://localhost:5001/user/dashboard/courses"  class="active">Courses</a></li>
                <li><a href="http://localhost:5001/user/lessionpage">Add Lesson</a></li>
                <li><a href="http://localhost:5001/user/courcepage">Create Courses</a></li>
                <li><a href="http://localhost:5001/logout">Logout</a></li>
            </ul>
        </nav>
    </header>
    <div class="courses-container">
        
        <h2>Available Courses</h2>
        <p>Search for courses:</p>
        <input type="text" id="search">
        <button onclick="showCourses()">Search</button>
        <ul id="course"></ul>
    </div>
    <footer>
        <p>&copy; 2025 Acadmia3 | Open Learning for All</p>
    </footer>
    <script th:src="@{/js/cources.js}"></script>
</body>
</html>
