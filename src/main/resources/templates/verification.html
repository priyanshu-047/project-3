<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Acadmia3 - Email Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 21px 10%;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }

        .logo h1 {
            font-weight: 800;
            font-size: 24px;
            color: #3b3b3b;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 600;
        }

        nav a:hover {
            color: #6c5ce7;
        }

        #otp-container {
            background: #ffffff;
            padding: 30px;
            margin: 60px auto 20px auto;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        #otp-container input,
        #otp-container button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        #otp-container button {
            background-color: #6c5ce7;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        #otp-container button:hover {
            background-color: #5945c0;
        }

        #container {
            background: #ffffff;
            padding: 40px;
            margin: 30px auto;
            width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #container label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        #container input,
        #container select,
        #container textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #container button {
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #6c5ce7;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #container button:hover {
            background-color: #5945c0;
        }

        footer {
            background-color: #ffffff;
            color: #999;
            text-align: center;
            padding: 30px 10%;
            font-size: 14px;
            border-top: 1px solid #eee;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Acadmia3</h1>
        </div>
        <nav>
            <ul>
                <li><a href="http://localhost:5001/">Home</a></li>
                <li><a href="http://localhost:5001/about">About Us</a></li>
                <li><a href="http://localhost:5001/about">Contact</a></li>
                <li><a href="http://localhost:5001/registration">Registration</a></li>
                <li><a href="http://localhost:5001/user/dashboard">Login</a></li>
            </ul>
        </nav>
    </header>

    <div id="otp-container">
        <h2 style="margin-bottom: 20px;">Verify Your Email</h2>
        <input type="email" id="email" name="email" placeholder="Enter email" required>
        <button onclick="getotp()">Send OTP</button>
    </div>

    <div id="container" style="display:none;">
        <h2 style="text-align: center;">User Registration</h2>
        <form action="/Adduser" method="post" enctype="multipart/form-data">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <input type="hidden" id="email1" name="email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="role">Role:</label>
            <select id="role" name="role">
                <option value="USER">User</option>
                <option value="TEACHER">Teacher</option>
            </select>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="profilePicture">Profile Picture:</label>
            <input type="file" id="profilePicture" name="profilePicture">

            <label for="bio">Bio:</label>
            <textarea id="bio" name="bio" rows="3"></textarea>

            <button type="submit">Register</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Acadmia3 | Open Learning for All</p>
    </footer>

    <script th:src="@{/js/verification.js}"></script>
</body>
</html>
