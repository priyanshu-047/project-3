<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - Acadmia3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff;
            color: #1a1a1a;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        .logo h1 {
            font-weight: 800;
            font-size: 28px;
            color: #3b3b3b;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav a {
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 600;
        }
        nav a.active,
        nav a:hover {
            color: #6c5ce7;
        }
        .form-container {
            padding: 40px 10%;
        }
        form {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        form input,
        form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #6c5ce7;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #5945c0;
        }
        footer {
            background-color: #ffffff;
            color: #999;
            text-align: center;
            padding: 30px 10%;
            font-size: 14px;
            border-top: 1px solid #eee;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Acadmia3</h1>
        </div>
        <nav>
            <ul>
                <li><a href="http://localhost:5001/" >Home</a></li>
                <li><a href="http://localhost:5001/user/dashboard">Dashboard</a></li>
                <li><a href="http://localhost:5001/user/dashboard/courses">Courses</a></li>
                <li><a href="http://localhost:5001/user/lessionpage">Add Lesson</a></li>
                <li><a href="http://localhost:5001/user/courcepage" class="active">Create Courses</a></li>
                <li><a href="http://localhost:5001/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <h1 style="text-align: center; margin-bottom: 30px;">Add Course</h1>
        <form action="addcourse" method="POST">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="title">Course Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="description">Course Description:</label>
            <textarea id="description" name="description" rows="5" required></textarea>

            <label for="price">Course Price:</label>
            <input type="number" id="price" name="price" min="0" required>

            <button type="submit">Add Course</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Acadmia3 | Open Learning for All</p>
    </footer>
</body>
</html>
