<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OpenEdu</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div th:if="${id!=null}" class="alert alert-danger">
     <p th:text="${id}"></p>
</div>
    
    <div class="login-container">
        <div class="login-card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to continue your learning journey.</p>
            
            <form th:action="@{/loginprocess}" method="post">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="email" id="username" name="email" placeholder="Enter your username" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <p class="register-text">Don't have an account? <a href="/register">register</a></p>
        </div>
    </div>
</body>
</html>
