<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Lesson - Acadmia3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fff;
      color: #1a1a1a;
      line-height: 1.6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 10%;
      background-color: #fff;
      border-bottom: 1px solid #eee;
    }
    .logo h1 {
      font-weight: 800;
      font-size: 28px;
      color: #3b3b3b;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }
    nav a {
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 600;
    }
    nav a.active,
    nav a:hover {
      color: #6c5ce7;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 32px;
      color: #6c5ce7;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 600;
    }
    input[type="text"],
    input[type="file"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #6c5ce7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #5945c0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <h1>Acadmia3</h1>
    </div>
    <nav>
      <ul>
        <li><a href="http://localhost:5001/" >Home</a></li>
      <li><a href="http://localhost:5001/user/dashboard">Dashboard</a></li>
        <li><a href="http://localhost:5001/user/dashboard/courses">Courses</a></li>
        <li><a href="http://localhost:5001/user/lessionpage" class="active">Add Lesson</a></li>
        <li><a href="http://localhost:5001/user/courcepage">Create Courses</a></li>
        <li><a href="http://localhost:5001/logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h1>Add Lesson</h1>
    <form action="/user/addlesson" method="POST" enctype="multipart/form-data">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required>

      <label for="content">Content:</label>
      <input type="file" id="content" name="content" required>

      <label for="course">Course ID:</label>
      <input type="number" name="cource-id" required>

      <button type="submit">Add Lesson</button>
    </form>
  </div>
</body>
</html>
